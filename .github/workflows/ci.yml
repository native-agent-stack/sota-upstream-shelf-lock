name: sota-shelf-lock-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"

      - name: Sync locked Python environment
        run: uv sync --locked --extra dev

      - name: Verify MADR 4.0 ADR catalog zero-drift
        run: uv run python scripts/architecture_catalog.py --check

      - name: Verify 18 upstream SHA pins, promotion ladder & privacy firewall
        run: uv run python -m shelf_lock.validator --verify-no-leaks --online

      - name: Run Ruff lint & format check
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run pytest deterministic invariant suite
        run: uv run pytest -v
